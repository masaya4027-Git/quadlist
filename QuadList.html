<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuadList</title>
<style>
/* QuadList ブラウザ版の見た目。ライト・ダーク両対応 */
:root {
  --bg: #f2f2f7;
  --panel: #ffffff;
  --sidebar: #e9e9ef;
  --text: #1c1c1e;
  --sub: #6e6e73;
  --line: #d8d8de;
  --hover: rgba(0, 0, 0, 0.05);
  --accent: #0a84ff;
  --danger: #ff3b30;
  --drop: rgba(10, 132, 255, 0.15);
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
  --c-blue: #0a84ff; --c-red: #ff3b30; --c-orange: #ff9500; --c-yellow: #ffcc00; --c-green: #34c759;
  --c-teal: #30b0c7; --c-purple: #af52de; --c-pink: #ff2d55; --c-gray: #8e8e93;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e; --panel: #2c2c2e; --sidebar: #18181a; --text: #f2f2f7; --sub: #a1a1a6;
    --line: #3a3a3c; --hover: rgba(255, 255, 255, 0.06); --drop: rgba(10, 132, 255, 0.25);
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 15px;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

/* 左の一覧 */
.sidebar { background: var(--sidebar); padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.brand { font-weight: 700; font-size: 18px; padding: 4px 8px 8px; }
.nav-section { font-size: 12px; font-weight: 700; color: var(--sub); padding: 12px 8px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 8px; border-radius: 8px;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); font-weight: 600; }
.nav-item.drop-target { background: var(--drop); outline: 2px solid var(--accent); }
.nav-item .count { margin-left: auto; color: var(--sub); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.inbox-icon { width: 18px; text-align: center; flex: none; font-size: 13px; }
.add-project { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 8px; color: var(--sub); }
.add-project:hover { background: var(--hover); }
.trash {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px; border-radius: 8px;
  border: 1px dashed var(--line); background: transparent; color: var(--sub);
}
.trash:hover { background: var(--hover); }
.trash.active { background: var(--panel); border-style: solid; color: var(--text); font-weight: 600; }
.trash .count { margin-left: auto; color: var(--sub); font-variant-numeric: tabular-nums; font-weight: 400; }
.trash.drop-target { background: rgba(255, 59, 48, 0.15); border: 1px solid var(--danger); color: var(--danger); }
/* 書き出し・読み込み(左下) */
.backup { margin-top: auto; padding: 0 4px; }
.backup-buttons { display: flex; gap: 6px; }
.backup-buttons button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 0; font-size: 13px; }
.backup-buttons button:hover { background: var(--hover); }
.backup-status { font-size: 11px; color: var(--sub); margin: 6px 0 0; }
.backup-status.stale { color: var(--c-orange); font-weight: 600; }
.note { font-size: 11px; color: var(--sub); line-height: 1.5; padding: 0 4px; }

/* 右の中身 */
.main { overflow-y: auto; padding: 24px 32px 96px; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.header h1 { font-size: 24px; margin: 0; }
.header .edit { margin-left: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }

.add-form { display: flex; gap: 8px; margin-bottom: 8px; }
.add-form textarea {
  flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel);
  border-radius: 10px; padding: 10px 12px; height: 42px; max-height: 160px;
  line-height: 20px; overflow: hidden;
}
.add-form button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 18px; font-weight: 600; }
.hint { font-size: 12px; color: var(--sub); margin: 0 0 16px; }

.card { background: var(--panel); border-radius: 12px; padding: 4px 0; }
.empty { color: var(--sub); padding: 16px; text-align: center; }

.row {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; position: relative;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }
.row.dragging { opacity: 0.35; }
.row .grip { cursor: grab; color: var(--sub); user-select: none; padding: 0 2px; }
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--sub);
  background: transparent; flex: none; padding: 0; display: grid; place-items: center;
}
.check.done { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 13px; }
/* 子が残っている親は完了にできない(押せないことが見てわかるように点線にする) */
.check:disabled { border-style: dotted; opacity: 0.5; cursor: not-allowed; }
/* 子: 親の下に字下げして並べる。親との間の線は出さない */
.row.top:has(+ .row.child) { border-bottom: 0; }
.row.child { padding-left: 60px; border-bottom: 0; padding-top: 4px; padding-bottom: 4px; }
.row.child + .row.top { border-top: 1px solid var(--line); }
.row.child .check { width: 18px; height: 18px; }
.row.child .check.done { font-size: 11px; }
.row.child .title { font-size: 14px; }
/* 子を追加(行の左。ふだんは薄く、行にマウスを乗せると濃くする) */
.add-child-btn {
  width: 22px; height: 22px; flex: none; border: 0; border-radius: 6px; padding: 0; background: transparent;
  color: var(--accent); font-size: 16px; font-weight: 700; line-height: 22px; opacity: 0.3;
}
button.add-child-btn:hover { background: var(--hover); }
.row:hover button.add-child-btn, button.add-child-btn:focus-visible { opacity: 1; }
.row.child.adding { padding-left: 84px; }
.done-at { font-size: 12px; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.child-input { flex: 1; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; background: var(--panel); font-size: 14px; }
.title { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; }
.row.done .title { text-decoration: line-through; color: var(--sub); }
.title-input { flex: 1; border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; background: var(--panel); }
.where { font-size: 12px; color: var(--sub); }
.icon-btn { border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; color: var(--sub); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
/* 完了直後は3秒そのまま残し、下の縁に残り時間のバーを出す */
.linger-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); opacity: 0.7; animation: linger 3s linear forwards; }
@keyframes linger { from { width: 100%; } to { width: 0; } }

/* プロジェクトの中: 未分類 + 4マス。上の列が「重要/重要でない」、左の行が「緊急/緊急でない」 */
.zone { background: var(--panel); border-radius: 12px; padding: 4px 0 8px; border: 2px solid transparent; min-width: 0; }
.zone.unsorted { margin-bottom: 16px; }
.zone.drop-target { border-color: var(--accent); background: linear-gradient(var(--drop), var(--drop)), var(--panel); }
.zone-head { display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px 12px 4px; font-size: 14px; }
.zone-head .count { margin-left: auto; color: var(--sub); font-weight: 400; font-variant-numeric: tabular-nums; }
.zone[data-quadrant="1"] .zone-head span:first-child { color: var(--c-red); }
.zone[data-quadrant="3"] .zone-head span:first-child { color: var(--c-orange); }
.zone[data-quadrant="2"] .zone-head span:first-child { color: var(--c-blue); }
.zone[data-quadrant="4"] .zone-head span:first-child { color: var(--c-gray); }
.zone-list { min-height: 44px; }
.zone-empty { color: var(--sub); font-size: 13px; padding: 12px; text-align: center; }
.matrix { display: grid; grid-template-columns: 24px 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 10px; }
.matrix .zone { min-height: 180px; }
.axis { font-size: 12px; font-weight: 700; color: var(--sub); text-align: center; }
.axis.row-axis { writing-mode: vertical-rl; align-self: center; letter-spacing: 0.1em; }
/* 落とす位置の線 */
.row.insert-before { box-shadow: inset 0 3px 0 var(--accent); }
.zone-list.insert-end { box-shadow: inset 0 -3px 0 var(--accent); }

/* ゴミ箱の中 */
.row.trashed { align-items: flex-start; }
.trash-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.trash-meta, .trash-kids { font-size: 12px; color: var(--sub); }
.trash-kids { overflow-wrap: anywhere; }
.restore-btn { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.restore-btn:hover { background: var(--hover); }
.header .edit.danger { color: var(--danger); }

details.done-section { margin-top: 16px; }
details.done-section summary { cursor: pointer; color: var(--sub); font-weight: 600; padding: 8px 4px; }
.done-actions { padding: 8px 12px; }
.text-btn { border: 0; background: transparent; color: var(--danger); padding: 4px 0; }

/* 取り消し */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
  display: flex; gap: 16px; align-items: center; background: var(--text); color: var(--bg);
  border-radius: 999px; padding: 10px 12px 10px 20px; box-shadow: var(--shadow); max-width: calc(100vw - 32px);
}
.toast[hidden] { display: none; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 8px; }

/* プロジェクトの設定 */
dialog { border: 0; border-radius: 14px; padding: 20px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
dialog h2 { margin: 0 0 16px; font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--sub); }
.field input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 15px; color: var(--text); }
.colors { border: 0; padding: 0; margin: 16px 0; display: flex; gap: 10px; flex-wrap: wrap; }
.colors legend { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
.color-option { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
.color-option[aria-checked="true"] { border-color: var(--text); }
.dialog-actions { display: flex; gap: 8px; align-items: center; }
.dialog-actions .spacer { flex: 1; }
.dialog-actions button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 14px; }
.dialog-actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.dialog-actions .danger { color: var(--danger); }

@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
  .sidebar { max-height: none; }
  .main { padding: 16px; }
  .matrix { grid-template-columns: 1fr; }
  .matrix .axis { display: none; }
  .matrix .zone { min-height: 0; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="一覧">
    <div class="brand">QuadList</div>
    <nav id="nav"></nav>
    <button class="add-project" id="add-project" type="button">＋ 新しいプロジェクト</button>
    <button class="trash" id="trash" type="button" title="クリックで中を見る。やることをここへドラッグするとゴミ箱へ入れる">
      <span class="inbox-icon">🗑</span><span>ゴミ箱</span><span class="count" id="trash-count"></span>
    </button>
    <div class="backup">
      <div class="backup-buttons">
        <button type="button" id="export">書き出す</button>
        <button type="button" id="import">読み込む</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p class="backup-status" id="backup-status"></p>
    </div>
    <p class="note">入力したやることは、このパソコンのこのブラウザの中だけに保存され、外へは送られません。機密情報は書かないでください。</p>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="project-dialog">
  <form method="dialog" id="project-form">
    <h2 id="project-dialog-title">プロジェクト</h2>
    <label class="field">名前<input id="project-name" required maxlength="60" autocomplete="off"></label>
    <fieldset class="colors" id="project-colors"><legend>色</legend></fieldset>
    <div class="dialog-actions">
      <button type="button" class="danger" id="project-delete">削除</button>
      <span class="spacer"></span>
      <button type="button" id="project-cancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<script>
// QuadList ブラウザ版のデータと計算(画面と切り離す。tests/test.html でテストする)
// データはこのブラウザの中(localStorage)だけに置く。iPhone 版とはつながらない(docs/BRAINSTORM.md)。
"use strict";

const QL = (() => {
  const STORAGE_KEY = "quadlist-web-v1";

  /** マスの位置。iPhone 版と同じ(q1 = 左上, q3 = 右上, q2 = 左下, q4 = 右下, 0 = 未分類) */
  const Quadrant = { unsorted: 0, q1: 1, q2: 2, q3: 3, q4: 4 };
  /** 並び順(左上 → 右上 → 左下 → 右下 → 未分類) */
  const DISPLAY_RANK = { 1: 1, 3: 2, 2: 3, 4: 4, 0: 5 };

  /** マスの名前と軸(iPhone 版の「緊急×重要」テンプレートと同じ) */
  const QUADRANT_NAMES = { 1: "すぐやる", 3: "任せる", 2: "計画する", 4: "やらない", 0: "未分類" };
  const AXES = { columns: ["重要", "重要でない"], rows: ["緊急", "緊急でない"] };

  /** プロジェクトの色(iPhone 版のリストの色と同じ9色) */
  const COLORS = ["blue", "red", "orange", "yellow", "green", "teal", "purple", "pink", "gray"];

  function newId() {
    return (crypto.randomUUID && crypto.randomUUID()) || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function emptyState() {
    return { version: 1, projects: [], items: [] };
  }

  // MARK: 保存

  function load(storage = localStorage) {
    try {
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      return normalize(JSON.parse(raw));
    } catch {
      return emptyState();
    }
  }

  function save(state, storage = localStorage) {
    storage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  /** 読み込んだデータの形をそろえる(足りない項目は初期値で埋める) */
  function normalize(data) {
    const state = emptyState();
    state.projects = (Array.isArray(data?.projects) ? data.projects : []).map((p, i) => ({
      id: String(p.id ?? newId()),
      name: String(p.name ?? "プロジェクト"),
      color: COLORS.includes(p.color) ? p.color : "blue",
      sortOrder: Number.isFinite(p.sortOrder) ? p.sortOrder : i + 1,
      createdAt: Number.isFinite(p.createdAt) ? p.createdAt : Date.now(),
    }));
    const projectIds = new Set(state.projects.map((p) => p.id));
    state.items = (Array.isArray(data?.items) ? data.items : []).map((it) => ({
      id: String(it.id ?? newId()),
      title: String(it.title ?? ""),
      // 消えたプロジェクトを指していたら、すべてのやること(null)に戻す
      projectId: it.projectId && projectIds.has(String(it.projectId)) ? String(it.projectId) : null,
      parentId: it.parentId ? String(it.parentId) : null,
      quadrant: [0, 1, 2, 3, 4].includes(it.quadrant) ? it.quadrant : 0,
      sortOrder: Number.isFinite(it.sortOrder) ? it.sortOrder : 0,
      done: Boolean(it.done),
      doneAt: Number.isFinite(it.doneAt) ? it.doneAt : null,
      createdAt: Number.isFinite(it.createdAt) ? it.createdAt : Date.now(),
      placedAt: Number.isFinite(it.placedAt) ? it.placedAt : Date.now(),
      // ゴミ箱に入れた時刻(null = ゴミ箱に入っていない)
      deletedAt: Number.isFinite(it.deletedAt) ? it.deletedAt : null,
    }));
    // 親子は1段だけ。親が見つからない子は、見えなくならないように親のない項目にする。子は親と同じプロジェクトに置く
    const tops = new Map(state.items.filter((it) => it.parentId == null).map((it) => [it.id, it]));
    for (const it of state.items) {
      if (it.parentId == null) continue;
      const parent = tops.get(it.parentId);
      if (parent) it.projectId = parent.projectId;
      else it.parentId = null;
    }
    return state;
  }

  // MARK: 書き出し・読み込み(ブラウザのデータが消えたとき・PC を替えたときの備え)

  const EXPORT_APP = "QuadList";

  /** 書き出す中身(JSON の文字列) */
  function exportJSON(state, now = Date.now()) {
    return JSON.stringify({
      app: EXPORT_APP, version: state.version, exportedAt: new Date(now).toISOString(),
      projects: state.projects, items: state.items,
    }, null, 2);
  }

  /** 書き出したファイルを読む。QuadList のファイルでなければ、理由つきでエラーにする */
  function parseImport(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error("ファイルを読めませんでした(JSON ではありません)");
    }
    if (data?.app !== EXPORT_APP || !Array.isArray(data.projects) || !Array.isArray(data.items)) {
      throw new Error("QuadList で書き出したファイルではありません");
    }
    return normalize(data);
  }

  // MARK: 並び順

  function displayOrder(items) {
    return [...items].sort((a, b) =>
      DISPLAY_RANK[a.quadrant] - DISPLAY_RANK[b.quadrant] ||
      a.sortOrder - b.sortOrder ||
      a.createdAt - b.createdAt);
  }

  /** 前後の項目の間に入れるときの並び順(他の項目を書き換えずに済む) */
  function orderBetween(before, after) {
    if (before != null && after != null) return (before + after) / 2;
    if (before != null) return before + 1;
    if (after != null) return after - 1;
    return 0;
  }

  /** ゴミ箱に入っていない */
  function isAlive(item) {
    return item.deletedAt == null;
  }

  /** 親のない項目(子は親の下に出す)。ゴミ箱の中は除く */
  function topItems(state, projectId) {
    return state.items.filter((it) => isAlive(it) && it.parentId == null && it.projectId === projectId);
  }

  function openItems(state, projectId) {
    return displayOrder(topItems(state, projectId).filter((it) => !it.done));
  }

  function doneItems(state, projectId) {
    return topItems(state, projectId).filter((it) => it.done).sort((a, b) => (b.doneAt ?? 0) - (a.doneAt ?? 0));
  }

  function itemsIn(state, projectId, quadrant) {
    return openItems(state, projectId).filter((it) => it.quadrant === quadrant);
  }

  function appendOrder(state, projectId, quadrant) {
    const list = itemsIn(state, projectId, quadrant);
    return orderBetween(list.length ? list[list.length - 1].sortOrder : null, null);
  }

  // MARK: 項目

  /** 「、」「,」「，」改行で区切って、複数の項目名にする */
  function splitTitles(text) {
    return String(text).split(/[、,，\n]/).map((s) => s.trim()).filter(Boolean);
  }

  /** 項目を追加する(未分類の末尾)。区切れば複数まとめて足せる。足した項目を返す */
  function addItems(state, text, projectId = null, now = Date.now()) {
    const added = [];
    for (const title of splitTitles(text)) {
      const item = {
        id: newId(), title, projectId, parentId: null, quadrant: Quadrant.unsorted,
        sortOrder: appendOrder(state, projectId, Quadrant.unsorted),
        done: false, doneAt: null, createdAt: now, placedAt: now, deletedAt: null,
      };
      state.items.push(item);
      added.push(item);
    }
    return added;
  }

  function findItem(state, id) {
    return state.items.find((it) => it.id === id);
  }

  /** 子(ゴミ箱の中は除く) */
  function children(state, parentId) {
    return state.items.filter((it) => isAlive(it) && it.parentId === parentId)
      .sort((a, b) => a.sortOrder - b.sortOrder || a.createdAt - b.createdAt);
  }

  function rename(state, id, title) {
    const item = findItem(state, id);
    const trimmed = String(title).trim();
    if (item && trimmed) item.title = trimmed;
  }

  /** 完了にできるか。未完了の子が残っている親は完了にできない */
  function canComplete(state, item) {
    return item.done || children(state, item.id).every((c) => c.done);
  }

  function setDone(state, id, done, now = Date.now()) {
    const item = findItem(state, id);
    if (!item) return false;
    if (done && !canComplete(state, item)) return false;
    item.done = done;
    item.doneAt = done ? now : null;
    if (!done && item.parentId == null) {
      // 未完了に戻した親は、マスの末尾に置き直す
      item.sortOrder = appendOrder(state, item.projectId, item.quadrant);
    }
    if (item.parentId != null) {
      const parent = findItem(state, item.parentId);
      // 子を未完了に戻したら、完了にしていた親も戻す(子が残っている親は完了にしない)
      if (!done && parent?.done) setDone(state, parent.id, false, now);
      // 子がすべて終わったら、親も完了にする
      if (done && parent && !parent.done && canComplete(state, parent)) setDone(state, parent.id, true, now);
    }
    return true;
  }

  /** 子を追加する(親の子の末尾)。区切れば複数まとめて足せる。完了済みの親や子には足さない */
  function addChildren(state, parentId, text, now = Date.now()) {
    const parent = findItem(state, parentId);
    if (!parent || parent.done || parent.parentId != null) return [];
    const added = [];
    for (const title of splitTitles(text)) {
      const list = children(state, parentId);
      const item = {
        id: newId(), title, projectId: parent.projectId, parentId, quadrant: Quadrant.unsorted,
        sortOrder: orderBetween(list.length ? list[list.length - 1].sortOrder : null, null),
        done: false, doneAt: null, createdAt: now, placedAt: now, deletedAt: null,
      };
      state.items.push(item);
      added.push(item);
    }
    return added;
  }

  /** 子の進み具合(「1/3」)。子がなければ空文字 */
  function childProgress(state, parentId) {
    const list = children(state, parentId);
    return list.length ? `${list.filter((c) => c.done).length}/${list.length}` : "";
  }

  /**
   * マスの中の、指定した項目の前に置く(beforeId が null ならマスの末尾)。
   * マスが変わったときだけ置いた時刻を数え直す。動かしたら true
   */
  function placeItem(state, id, quadrant, beforeId = null, now = Date.now()) {
    const item = findItem(state, id);
    if (!item || item.done || item.parentId != null || item.projectId == null) return false;
    if (![0, 1, 2, 3, 4].includes(quadrant) || beforeId === id) return false;
    const list = itemsIn(state, item.projectId, quadrant).filter((it) => it.id !== id);
    const index = beforeId == null ? list.length : list.findIndex((it) => it.id === beforeId);
    if (index < 0) return false;
    if (item.quadrant !== quadrant) item.placedAt = now;
    item.quadrant = quadrant;
    item.sortOrder = orderBetween(list[index - 1]?.sortOrder ?? null, list[index]?.sortOrder ?? null);
    return true;
  }

  // MARK: ゴミ箱(削除した項目は、ゴミ箱を空にするまで残す)

  /** ゴミ箱へ入れる(子も一緒に)。入れた項目の id を返す(すぐの取り消し用) */
  function trashItems(state, ids, now = Date.now()) {
    const targets = new Set();
    for (const id of ids) {
      const item = findItem(state, id);
      if (!item || !isAlive(item)) continue;
      targets.add(item.id);
      for (const child of children(state, item.id)) targets.add(child.id);
    }
    for (const id of targets) findItem(state, id).deletedAt = now;
    return [...targets];
  }

  /** ゴミ箱へ入れた直後の取り消し(元の位置のまま戻す) */
  function undoTrash(state, ids) {
    for (const id of ids) {
      const item = findItem(state, id);
      if (item) item.deletedAt = null;
    }
  }

  /** ゴミ箱の一覧。親と一緒に入れた子は親にまとめ、新しく入れた順に並べる */
  function trashedItems(state) {
    return state.items.filter((it) => {
      if (isAlive(it)) return false;
      const parent = it.parentId == null ? null : findItem(state, it.parentId);
      return !parent || parent.deletedAt !== it.deletedAt;
    }).sort((a, b) => b.deletedAt - a.deletedAt);
  }

  /** 一緒にゴミ箱へ入れた子 */
  function trashedChildren(state, item) {
    return state.items.filter((it) => it.parentId === item.id && it.deletedAt != null && it.deletedAt === item.deletedAt);
  }

  /**
   * ゴミ箱から元の場所へ戻す(一緒に入れた子も)。マスの末尾に入る。
   * プロジェクトが消えていたら すべてのやること へ。親がいない子は、親の場所に1つの項目として戻す
   */
  function restoreFromTrash(state, id) {
    const item = findItem(state, id);
    if (!item || isAlive(item)) return false;
    const kids = trashedChildren(state, item);
    const projectIds = new Set(state.projects.map((p) => p.id));
    if (item.parentId != null) {
      const parent = findItem(state, item.parentId);
      if (parent && isAlive(parent)) {
        item.projectId = parent.projectId;
        // 未完了の子が戻ったら、完了にしていた親も戻す(子が残っている親は完了にしない)
        if (!item.done && parent.done) setDone(state, parent.id, false);
      } else {
        item.parentId = null;
        item.quadrant = Quadrant.unsorted;
      }
    }
    if (item.projectId != null && !projectIds.has(item.projectId)) item.projectId = null;
    if (item.parentId == null) {
      if (item.projectId == null) item.quadrant = Quadrant.unsorted;
      item.sortOrder = appendOrder(state, item.projectId, item.quadrant);
    }
    item.deletedAt = null;
    for (const child of kids) {
      child.deletedAt = null;
      child.projectId = item.projectId;
    }
    return true;
  }

  /** ゴミ箱を空にする(元に戻せない)。消した件数を返す */
  function emptyTrash(state) {
    const before = state.items.length;
    state.items = state.items.filter(isAlive);
    return before - state.items.length;
  }

  /** 完全に削除(子も一緒に)。取り消し用に、消した項目の写しを返す */
  function deleteItems(state, ids) {
    const targets = new Set(ids);
    for (const it of state.items) if (it.parentId && targets.has(it.parentId)) targets.add(it.id);
    const removed = state.items.filter((it) => targets.has(it.id)).map((it) => ({ ...it }));
    state.items = state.items.filter((it) => !targets.has(it.id));
    return removed;
  }

  function restoreItems(state, removed) {
    const existing = new Set(state.items.map((it) => it.id));
    const projectIds = new Set(state.projects.map((p) => p.id));
    for (const it of removed) {
      if (existing.has(it.id)) continue;
      state.items.push({ ...it, projectId: it.projectId && projectIds.has(it.projectId) ? it.projectId : null });
    }
  }

  /** プロジェクトへ移す(null = すべてのやること)。マスはそのまま、移した先のマスの末尾へ。置いた時刻は数え直す */
  function moveToProject(state, ids, projectId, now = Date.now()) {
    const before = [];
    for (const id of ids) {
      const item = findItem(state, id);
      if (!item || item.parentId != null || item.projectId === projectId) continue;
      before.push({ ...item });
      // すべてのやることへ戻すときは、振り分け直す前提でマスを外す
      if (projectId == null) item.quadrant = Quadrant.unsorted;
      item.sortOrder = appendOrder(state, projectId, item.quadrant);
      item.projectId = projectId;
      item.placedAt = now;
      // 子も親と同じプロジェクトへ(古いプロジェクトを消したときに、子だけ消えないように)
      for (const child of children(state, item.id)) {
        before.push({ ...child });
        child.projectId = projectId;
      }
    }
    return before;
  }

  /** 移動の取り消し(写した時点の状態に戻す) */
  function undoMove(state, before) {
    for (const b of before) {
      const item = findItem(state, b.id);
      if (item) Object.assign(item, b);
    }
  }

  // MARK: プロジェクト

  function sortedProjects(state) {
    return [...state.projects].sort((a, b) => a.sortOrder - b.sortOrder || a.createdAt - b.createdAt);
  }

  function createProject(state, name, color = "blue", now = Date.now()) {
    const trimmed = String(name).trim();
    if (!trimmed) return null;
    const project = {
      id: newId(), name: trimmed, color: COLORS.includes(color) ? color : "blue",
      sortOrder: Math.max(0, ...state.projects.map((p) => p.sortOrder)) + 1, createdAt: now,
    };
    state.projects.push(project);
    return project;
  }

  function updateProject(state, id, { name, color }) {
    const project = state.projects.find((p) => p.id === id);
    if (!project) return;
    if (name != null && String(name).trim()) project.name = String(name).trim();
    if (color != null && COLORS.includes(color)) project.color = color;
  }

  /** プロジェクトを削除する(中の項目も子も消える) */
  function deleteProject(state, id) {
    const ids = state.items.filter((it) => it.projectId === id).map((it) => it.id);
    deleteItems(state, ids);
    state.projects = state.projects.filter((p) => p.id !== id);
  }

  function openCount(state, projectId) {
    return topItems(state, projectId).filter((it) => !it.done).length;
  }

  return {
    STORAGE_KEY, Quadrant, COLORS, emptyState, load, save, normalize, exportJSON, parseImport,
    displayOrder, orderBetween, topItems, openItems, doneItems, itemsIn, appendOrder,
    QUADRANT_NAMES, AXES,
    splitTitles, addItems, findItem, children, rename, canComplete, setDone, addChildren, childProgress,
    placeItem, deleteItems, restoreItems, isAlive,
    trashItems, undoTrash, trashedItems, trashedChildren, restoreFromTrash, emptyTrash,
    moveToProject, undoMove, sortedProjects, createProject, updateProject, deleteProject, openCount,
  };
})();

if (typeof module !== "undefined") module.exports = QL;

</script>
<script>
// QuadList ブラウザ版の画面(溜める・プロジェクト・振り分け・4マス・親子・書き出し)
// 左: すべてのやること・プロジェクトの一覧・ゴミ箱(ドラッグで落とす先)。右: 選んだものの中身
"use strict";

(() => {
  const LINGER_MS = 3000;  // 完了してから消えるまで(この間に戻せる)
  const UNDO_MS = 5000;    // 「取り消す」を出しておく時間

  let state = QL.load();
  /** 開いているもの。null = すべてのやること、文字列 = プロジェクトの id */
  let selected = null;
  /** ゴミ箱の中を見ているか(見ている間は selected より優先) */
  let showingTrash = false;
  /** 完了直後で残している項目の id */
  const lingering = new Set();
  let editingId = null;
  let draggingId = null;
  /** 「子を追加」の入力欄を開いている親の id */
  let addingChildFor = null;
  /** 描き直しで入力欄が消えるときの focusout を無視するため */
  let rendering = false;

  const $ = (id) => document.getElementById(id);
  const nav = $("nav");
  const main = $("main");

  /** 項目名などを HTML に入れるときは必ずこれを通す */
  function esc(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function commit() {
    QL.save(state);
    render();
  }

  function projectById(id) {
    return state.projects.find((p) => p.id === id) ?? null;
  }

  function nameOf(projectId) {
    return projectId == null ? "すべてのやること" : projectById(projectId)?.name ?? "";
  }

  /** 追加のキー(Mac は ⌘+Enter、Windows などは Ctrl+Enter) */
  const IS_MAC = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform ?? navigator.platform ?? "");
  const ADD_KEY = IS_MAC ? "⌘+Enter" : "Ctrl+Enter";

  // MARK: 描画

  function render() {
    if (selected != null && !projectById(selected)) selected = null;
    const parent = addingChildFor && QL.findItem(state, addingChildFor);
    if (!parent || parent.done) addingChildFor = null;
    rendering = true;
    renderNav();
    renderMain();
    renderBackupStatus();
    rendering = false;
  }

  function renderNav() {
    const entry = (id, label, icon, count) => `
      <button class="nav-item${!showingTrash && selected === id ? " active" : ""}" data-nav="${id ?? ""}" type="button">
        ${icon}<span>${esc(label)}</span><span class="count">${count}</span>
      </button>`;
    nav.innerHTML =
      entry(null, "すべてのやること", `<span class="inbox-icon">📥</span>`, QL.openCount(state, null)) +
      `<div class="nav-section">プロジェクト</div>` +
      (QL.sortedProjects(state).map((p) =>
        entry(p.id, p.name, `<span class="dot" style="background: var(--c-${p.color})"></span>`, QL.openCount(state, p.id))
      ).join("") || `<div class="hint" style="padding: 4px 8px">まだありません</div>`);
    const trash = $("trash");
    trash.classList.toggle("active", showingTrash);
    const count = QL.trashedItems(state).length;
    $("trash-count").textContent = count || "";
  }

  function renderMain() {
    if (showingTrash) { renderTrash(); return; }
    const project = selected == null ? null : projectById(selected);
    const open = QL.displayOrder(QL.topItems(state, selected).filter((it) => !it.done || lingering.has(it.id)));
    const done = QL.doneItems(state, selected).filter((it) => !lingering.has(it.id));
    main.innerHTML = `
      <div class="header">
        ${project ? `<span class="dot" style="background: var(--c-${project.color}); width: 14px; height: 14px"></span>` : ""}
        <h1>${esc(nameOf(selected))}</h1>
        ${project ? `<button class="edit" id="edit-project" type="button">プロジェクトを編集</button>` : ""}
      </div>
      <form class="add-form" id="add-form">
        <textarea id="add-text" rows="1" placeholder="やることを追加(${ADD_KEY} で追加 / Enter で改行)" aria-label="やることを追加"></textarea>
        <button type="submit" title="${ADD_KEY}">追加</button>
      </form>
      <p class="hint">「、」「,」または改行で区切ると、まとめて追加できます。${project
        ? "追加した項目は未分類に入ります。マスへドラッグして仕分けます。"
        : "左のプロジェクトへドラッグすると振り分けられます。"}</p>
      ${project ? matrixHTML(open) : `
        <div class="card" id="open-list">
          ${open.length ? open.map(rowHTML).join("") : `<div class="empty">ここに溜めて、あとでプロジェクトへ振り分けます</div>`}
        </div>`}
      ${done.length ? `
        <details class="done-section">
          <summary>完了済み (${done.length})</summary>
          <div class="card">${done.map(rowHTML).join("")}
            <div class="done-actions"><button class="text-btn" data-action="clear-done" type="button">完了済みをゴミ箱へ</button></div>
          </div>
        </details>` : ""}`;
    if (editingId) {
      const input = main.querySelector(".title-input");
      input?.focus();
      input?.select();
    } else if (addingChildFor) {
      main.querySelector(".child-input")?.focus();
    }
  }

  /** ゴミ箱の中: 新しく入れた順。元に戻す・まとめて完全に削除 */
  function renderTrash() {
    const items = QL.trashedItems(state);
    const where = (item) => {
      const parent = item.parentId == null ? null : QL.findItem(state, item.parentId);
      if (parent) return `「${parent.title}」の子`;
      return item.projectId != null && !projectById(item.projectId) ? "削除したプロジェクト" : nameOf(item.projectId);
    };
    const row = (item) => {
      const kids = QL.trashedChildren(state, item);
      return `
        <div class="row trashed${item.done ? " done" : ""}" data-trash-id="${item.id}">
          <div class="trash-body">
            <span class="title">${esc(item.title)}</span>
            <span class="trash-meta">${esc(where(item))}${kids.length ? `・子${kids.length}件` : ""}・${doneLabel(item.deletedAt)} 削除</span>
            ${kids.length ? `<span class="trash-kids">${kids.map((k) => esc(k.title)).join("、")}</span>` : ""}
          </div>
          <button class="restore-btn" data-action="restore" type="button">元に戻す</button>
        </div>`;
    };
    main.innerHTML = `
      <div class="header">
        <h1>🗑 ゴミ箱</h1>
        ${items.length ? `<button class="edit danger" data-action="empty-trash" type="button">ゴミ箱を空にする</button>` : ""}
      </div>
      <p class="hint">削除したやることは、ゴミ箱を空にするまでここに残ります。「元に戻す」で元の場所へ戻せます。</p>
      <div class="card">
        ${items.length ? items.map(row).join("") : `<div class="empty">ゴミ箱は空です</div>`}
      </div>`;
  }

  /** プロジェクトの中: 未分類 + 4マス(左上 すぐやる、右上 任せる、左下 計画する、右下 やらない) */
  function matrixHTML(open) {
    const zone = (q) => {
      const items = open.filter((it) => it.quadrant === q);
      return `
        <section class="zone${q === 0 ? " unsorted" : ""}" data-quadrant="${q}" aria-label="${QL.QUADRANT_NAMES[q]}">
          <h2 class="zone-head"><span>${QL.QUADRANT_NAMES[q]}</span><span class="count">${items.length}</span></h2>
          <div class="zone-list">
            ${items.length ? items.map(rowHTML).join("") : `<div class="zone-empty">${q === 0 ? "追加した項目はここに入ります" : "ここへドラッグ"}</div>`}
          </div>
        </section>`;
    };
    const { columns, rows } = QL.AXES;
    return `
      ${zone(QL.Quadrant.unsorted)}
      <div class="matrix">
        <span></span>
        <div class="axis col">${columns[0]}</div>
        <div class="axis col">${columns[1]}</div>
        <div class="axis row-axis">${rows[0]}</div>
        ${zone(QL.Quadrant.q1)}${zone(QL.Quadrant.q3)}
        <div class="axis row-axis">${rows[1]}</div>
        ${zone(QL.Quadrant.q2)}${zone(QL.Quadrant.q4)}
      </div>`;
  }

  /** 完了した日時(今日なら時刻だけ、今年なら月日と時刻) */
  function doneLabel(time) {
    const d = new Date(time);
    const now = new Date();
    const hm = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === now.toDateString()) return `今日 ${hm}`;
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === now.getFullYear() ? `${md} ${hm}` : `${d.getFullYear()}/${md} ${hm}`;
  }

  /** 1行。親のない項目は、未完了なら下に子と「子を追加」の入力欄を続ける */
  function rowHTML(item) {
    const isLinger = lingering.has(item.id);
    const isChild = item.parentId != null;
    // どの行もドラッグできる(ゴミ箱へ落とすと削除)。名前の変更中だけは文字を選べるように止める
    const draggable = editingId !== item.id;
    const canAddChild = !isChild && !item.done;
    // 子が残っている親は完了にできない
    const blocked = !item.done && !QL.canComplete(state, item);
    const progress = isChild ? "" : QL.childProgress(state, item.id);
    const title = editingId === item.id
      ? `<input class="title-input" data-edit="${item.id}" value="${esc(item.title)}" aria-label="名前を変更">`
      : `<span class="title" data-rename="${item.id}" title="${item.done ? "" : "クリックで名前を変更"}">${esc(item.title)}</span>`;
    const row = `
      <div class="row ${isChild ? "child" : "top"}${item.done ? " done" : ""}" draggable="${draggable}" data-id="${item.id}">
        <span class="grip" aria-hidden="true">⋮⋮</span>
        ${isChild ? "" : canAddChild
          ? `<button class="add-child-btn" data-action="add-child" type="button" aria-label="子を追加" title="子を追加">＋</button>`
          : `<span class="add-child-btn" aria-hidden="true"></span>`}
        <button class="check${item.done ? " done" : ""}" data-action="toggle" type="button"${blocked ? " disabled" : ""}
          aria-label="${item.done ? "未完了に戻す" : "完了にする"}"
          title="${blocked ? "子がすべて終わると完了にできます" : ""}">${item.done ? "✓" : ""}</button>
        ${title}
        ${progress ? `<span class="progress">${progress}</span>` : ""}
        ${item.done && item.doneAt ? `<span class="done-at" title="完了した日時">${doneLabel(item.doneAt)} 完了</span>` : ""}
        ${isLinger ? `<span class="linger-bar"></span>` : ""}
      </div>`;
    // 完了直後に残している親は、子も一緒に見せる
    if (isChild || (item.done && !isLinger)) return row;
    const adding = addingChildFor === item.id && !item.done ? `
      <div class="row child adding">
        <input class="child-input" data-parent="${item.id}" placeholder="子を追加(Enter で追加 / Esc で閉じる)" aria-label="子を追加">
      </div>` : "";
    return row + QL.children(state, item.id).map(rowHTML).join("") + adding;
  }

  // MARK: 操作

  function addFromInput() {
    const textarea = $("add-text");
    const added = QL.addItems(state, textarea.value, selected);
    if (!added.length) return;
    commit();
    $("add-text").focus();
  }

  function toggle(id) {
    const item = QL.findItem(state, id);
    if (!item) return;
    if (item.parentId != null) {
      // 子は消さずに、親の下で線を引いたまま残す。戻したら親も未完了に戻る
      const parent = QL.findItem(state, item.parentId);
      QL.setDone(state, id, !item.done);
      if (!item.done) lingering.delete(parent.id);
      else if (parent.done) linger(parent.id);  // 最後の子で親も完了 → 親も3秒残す
      commit();
      return;
    }
    if (lingering.has(id)) {
      // 完了直後にもう一度押した → 元の位置のまま戻す
      lingering.delete(id);
      item.done = false;
      item.doneAt = null;
      commit();
      return;
    }
    if (item.done) {
      QL.setDone(state, id, false);
      commit();
      return;
    }
    if (!QL.setDone(state, id, true)) return;
    linger(id);
    commit();
  }

  /** 完了直後の項目を3秒その場に残す */
  function linger(id) {
    lingering.add(id);
    setTimeout(() => {
      if (lingering.delete(id)) render();
    }, LINGER_MS);
  }

  function move(ids, projectId) {
    const before = QL.moveToProject(state, ids, projectId);
    if (!before.length) return;
    commit();
    const label = before.length === 1 ? `「${before[0].title}」` : `${before.length}件`;
    showUndo(`${label}を${nameOf(projectId)}へ移しました`, () => QL.undoMove(state, before));
  }

  /** ゴミ箱へ入れる(子も一緒に)。5秒は「取り消す」で元の位置に戻せる */
  function remove(ids) {
    const trashed = QL.trashItems(state, ids);
    if (!trashed.length) return;
    commit();
    const label = ids.length === 1 ? `「${QL.findItem(state, ids[0]).title}」` : `${ids.length}件`;
    showUndo(`${label}をゴミ箱へ入れました`, () => QL.undoTrash(state, trashed));
  }

  function restore(id) {
    const item = QL.findItem(state, id);
    if (!item || !QL.restoreFromTrash(state, id)) return;
    commit();
    const back = item.parentId != null ? `「${QL.findItem(state, item.parentId).title}」の子` : nameOf(item.projectId);
    showUndo(`「${item.title}」を${back}へ戻しました`, () => QL.trashItems(state, [id]));
  }

  // MARK: 取り消し

  let undoTimer = null;
  function showUndo(message, undo) {
    const toast = $("toast");
    toast.innerHTML = `<span>${esc(message)}</span><button type="button">取り消す</button>`;
    toast.hidden = false;
    toast.querySelector("button").onclick = () => {
      undo();
      toast.hidden = true;
      commit();
    };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { toast.hidden = true; }, UNDO_MS);
  }

  // MARK: プロジェクトの作成・編集

  const dialog = $("project-dialog");
  let dialogProjectId = null;
  let dialogColor = "blue";

  function renderColors() {
    $("project-colors").innerHTML = `<legend>色</legend>` + QL.COLORS.map((c) =>
      `<button type="button" class="color-option" role="radio" aria-checked="${c === dialogColor}" aria-label="${c}"
        data-color="${c}" style="background: var(--c-${c})"></button>`).join("");
  }

  function openProjectDialog(project) {
    dialogProjectId = project?.id ?? null;
    dialogColor = project?.color ?? "blue";
    $("project-dialog-title").textContent = project ? "プロジェクトを編集" : "新しいプロジェクト";
    $("project-name").value = project?.name ?? "";
    $("project-delete").hidden = !project;
    renderColors();
    dialog.showModal();
    $("project-name").focus();
  }

  $("project-colors").addEventListener("click", (e) => {
    const option = e.target.closest("[data-color]");
    if (!option) return;
    dialogColor = option.dataset.color;
    renderColors();
  });
  $("project-cancel").addEventListener("click", () => dialog.close());
  $("project-form").addEventListener("submit", (e) => {
    const name = $("project-name").value;
    if (!name.trim()) { e.preventDefault(); return; }
    if (dialogProjectId) {
      QL.updateProject(state, dialogProjectId, { name, color: dialogColor });
    } else {
      const project = QL.createProject(state, name, dialogColor);
      if (project) { selected = project.id; showingTrash = false; }
    }
    commit();
  });
  $("project-delete").addEventListener("click", () => {
    const project = projectById(dialogProjectId);
    if (!project) return;
    const count = QL.topItems(state, project.id).length;
    if (!confirm(`「${project.name}」を削除しますか？\n中の項目(${count}件)もすべて削除されます。元に戻せません。`)) return;
    QL.deleteProject(state, project.id);
    dialog.close();
    selected = null;
    commit();
  });
  $("add-project").addEventListener("click", () => openProjectDialog(null));

  // MARK: 書き出し・読み込み

  const EXPORTED_KEY = "quadlist-web-exported-at";
  const STALE_DAYS = 7;  // これより前の書き出しは、目立たせてこまめな書き出しを促す

  function exportedAt() {
    try { return Number(localStorage.getItem(EXPORTED_KEY)) || null; } catch { return null; }
  }

  function renderBackupStatus() {
    const status = $("backup-status");
    const at = exportedAt();
    const days = at == null ? Infinity : (Date.now() - at) / 86400000;
    status.textContent = at == null ? "まだ書き出していません"
      : `最後の書き出し: ${new Date(at).toLocaleDateString("ja-JP", { month: "long", day: "numeric" })}`;
    status.classList.toggle("stale", state.items.length > 0 && days > STALE_DAYS);
  }

  $("export").addEventListener("click", () => {
    const now = Date.now();
    const blob = new Blob([QL.exportJSON(state, now)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    const d = new Date(now);
    const pad = (n) => String(n).padStart(2, "0");
    link.download = `quadlist-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    try { localStorage.setItem(EXPORTED_KEY, String(now)); } catch { /* 記録できなくても書き出しはできている */ }
    renderBackupStatus();
  });

  $("import").addEventListener("click", () => $("import-file").click());
  $("import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";  // 同じファイルをもう一度選んでも反応するように
    if (!file) return;
    let imported;
    try {
      imported = QL.parseImport(await file.text());
    } catch (error) {
      alert(error.message);
      return;
    }
    const count = (s) => `プロジェクト${s.projects.length}件・やること${s.items.filter((it) => it.parentId == null).length}件`;
    if (!confirm(`今のデータ(${count(state)})を、ファイルの中身(${count(imported)})に置き換えます。\n今のデータは消えます。続けますか？`)) return;
    const previous = state;
    state = imported;
    selected = null;
    showingTrash = false;
    editingId = null;
    addingChildFor = null;
    lingering.clear();
    commit();
    showUndo(`「${file.name}」を読み込みました`, () => { state = previous; });
  });

  // MARK: イベント

  nav.addEventListener("click", (e) => {
    const item = e.target.closest("[data-nav]");
    if (!item) return;
    selected = item.dataset.nav || null;
    showingTrash = false;
    editingId = null;
    render();
  });

  main.addEventListener("submit", (e) => {
    if (e.target.id !== "add-form") return;
    e.preventDefault();
    addFromInput();
  });

  // 入力欄は、書いた行数に合わせて伸ばす(最大 160px。超えたらスクロール)
  main.addEventListener("input", (e) => {
    if (e.target.id !== "add-text") return;
    const box = e.target;
    box.style.height = "auto";
    box.style.height = `${Math.min(box.scrollHeight + 2, 160)}px`;
    box.style.overflowY = box.scrollHeight > 158 ? "auto" : "hidden";
  });

  main.addEventListener("keydown", (e) => {
    if (e.target.id === "add-text" && e.key === "Enter" && (e.metaKey || e.ctrlKey) && !e.isComposing) {
      e.preventDefault();
      addFromInput();
    }
    if (e.target.classList.contains("child-input")) {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        // 足したあとも入力欄を開いたままにして、続けて書けるようにする
        if (QL.addChildren(state, e.target.dataset.parent, e.target.value).length) commit();
      }
      if (e.key === "Escape") { addingChildFor = null; render(); }
    }
    if (e.target.classList.contains("title-input")) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); e.target.blur(); }
      if (e.key === "Escape") { editingId = null; render(); }
    }
  });

  main.addEventListener("focusout", (e) => {
    if (rendering) return;
    if (e.target.classList.contains("child-input")) {
      // 書きかけのまま外へ出たら、足してから閉じる
      QL.addChildren(state, e.target.dataset.parent, e.target.value);
      addingChildFor = null;
      commit();
      return;
    }
    if (!e.target.classList.contains("title-input")) return;
    QL.rename(state, e.target.dataset.edit, e.target.value);
    editingId = null;
    commit();
  });

  main.addEventListener("click", (e) => {
    if (e.target.closest("#edit-project")) { openProjectDialog(projectById(selected)); return; }
    const row = e.target.closest(".row");
    const action = e.target.closest("[data-action]")?.dataset.action;
    if (action === "clear-done") {
      remove(QL.doneItems(state, selected).map((it) => it.id));
      return;
    }
    if (action === "empty-trash") {
      const count = QL.trashedItems(state).length;
      if (!confirm(`ゴミ箱の${count}件を完全に削除します。\n元に戻せません。続けますか？`)) return;
      QL.emptyTrash(state);
      commit();
      return;
    }
    if (action === "restore") {
      restore(e.target.closest("[data-trash-id]").dataset.trashId);
      return;
    }
    if (!row) return;
    const item = QL.findItem(state, row.dataset.id);
    if (!item) return;
    if (action === "toggle") toggle(item.id);
    else if (action === "add-child") { addingChildFor = item.id; editingId = null; render(); }
    else if (e.target.closest("[data-rename]") && !item.done) { editingId = item.id; render(); }
  });

  // ドラッグ: 行を左のプロジェクト(または すべてのやること)へ落とすと移す
  main.addEventListener("dragstart", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    draggingId = row.dataset.id;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggingId);
  });
  main.addEventListener("dragend", () => {
    draggingId = null;
    clearDropMarks();
    document.querySelectorAll(".dragging, .drop-target").forEach((el) => el.classList.remove("dragging", "drop-target"));
  });

  /** マスやプロジェクトへ動かせるのは、親のない未完了の項目だけ(子と完了済みは、ゴミ箱へだけ落とせる) */
  function draggingMovable() {
    const item = draggingId && QL.findItem(state, draggingId);
    return Boolean(item && item.parentId == null && !item.done);
  }

  // ドラッグ: プロジェクトの中では、マスへ落とすと仕分け、マスの中の位置で並べ替え
  function clearDropMarks() {
    main.querySelectorAll(".zone.drop-target, .insert-before, .insert-end")
      .forEach((el) => el.classList.remove("drop-target", "insert-before", "insert-end"));
  }

  /** マウスの高さから、どの行の前に入れるかを決める(null = 末尾) */
  function dropBefore(zone, y) {
    // 子は親と一緒に動くので、親のない行だけを目印にする
    const rows = [...zone.querySelectorAll(".row.top:not(.dragging)")];
    return rows.find((row) => {
      const rect = row.getBoundingClientRect();
      return y < rect.top + rect.height / 2;
    }) ?? null;
  }

  main.addEventListener("dragover", (e) => {
    const zone = e.target.closest("[data-quadrant]");
    if (!zone || !draggingMovable()) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const before = dropBefore(zone, e.clientY);
    clearDropMarks();
    zone.classList.add("drop-target");
    if (before) before.classList.add("insert-before");
    else zone.querySelector(".zone-list").classList.add("insert-end");
  });
  main.addEventListener("dragleave", (e) => {
    const zone = e.target.closest("[data-quadrant]");
    if (zone && !zone.contains(e.relatedTarget)) clearDropMarks();
  });
  main.addEventListener("drop", (e) => {
    const zone = e.target.closest("[data-quadrant]");
    if (!zone || !draggingId) return;
    e.preventDefault();
    const before = dropBefore(zone, e.clientY);
    const moved = QL.placeItem(state, draggingId, Number(zone.dataset.quadrant), before?.dataset.id ?? null);
    clearDropMarks();
    if (moved) commit();
  });
  nav.addEventListener("dragover", (e) => {
    const target = e.target.closest("[data-nav]");
    if (!target || !draggingMovable()) return;
    e.preventDefault();
    nav.querySelectorAll(".drop-target").forEach((el) => el !== target && el.classList.remove("drop-target"));
    target.classList.add("drop-target");
  });
  nav.addEventListener("dragleave", (e) => {
    const target = e.target.closest("[data-nav]");
    if (target && !target.contains(e.relatedTarget)) target.classList.remove("drop-target");
  });
  nav.addEventListener("drop", (e) => {
    const target = e.target.closest("[data-nav]");
    if (!target || !draggingId) return;
    e.preventDefault();
    move([draggingId], target.dataset.nav || null);
  });

  // ゴミ箱: 行を落とすと削除(5秒は取り消せる)
  const trash = $("trash");
  trash.addEventListener("click", () => {
    showingTrash = true;
    editingId = null;
    addingChildFor = null;
    render();
  });
  trash.addEventListener("dragover", (e) => {
    if (!draggingId) return;
    e.preventDefault();
    trash.classList.add("drop-target");
  });
  trash.addEventListener("dragleave", (e) => {
    if (!trash.contains(e.relatedTarget)) trash.classList.remove("drop-target");
  });
  trash.addEventListener("drop", (e) => {
    if (!draggingId) return;
    e.preventDefault();
    trash.classList.remove("drop-target");
    lingering.delete(draggingId);
    remove([draggingId]);
  });

  // 別のタブで開いていても、保存したら揃える
  window.addEventListener("storage", (e) => {
    if (e.key !== QL.STORAGE_KEY) return;
    state = QL.load();
    render();
  });

  render();
})();

</script>
</body>
</html>
